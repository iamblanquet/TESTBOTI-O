  <body class="bg-slate-100 text-slate-900 antialiased select-none font-sans min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Registro del Service Worker para funcionamiento PWA Offline-First
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('✅ Service Worker PWA activo:', reg.scope))
            .catch(err => console.log('SW registration error:', err));
        });
      }
    </script>
